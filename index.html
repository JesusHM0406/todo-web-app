<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded&icon_names=check_circle,dangerous,light_mode,dark_mode" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <div class="theme-toggler">
      <button id="togglerBtn">
        <span class="material-symbols-rounded">light_mode</span>
      </button>
    </div>

    <main class="main">
      <h1 class="title">My tasks</h1>

      <div class="content">
        <div class="content__pending-counter content__container">
          <span id="taskCount"></span>
        </div>

        <div class="content__header content__container">
          <input type="text" id="taskInput" placeholder="Add a new task..." autocomplete="off">
          <button id="addBtn">Add</button>
        </div>

        <div class="content__filter content__container">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div class="content__todo content__container">
          <ul class="content__todo-list"></ul>
        </div>

        <button id="clearCompleted" class="clear-btn">Clear completed</button>
      </div>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
